<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Admin Log in | R&R Sweet Bites</title>

  <style>

    :root{
      --color-primary:#D27685;
      --color-primary-hover:#BE5B6C;
      --bg-main:#FAF0E6;
      --bg-card:#FFFFFF;
      --bg-placeholder:#F2D5D5;
      --bg-footer:#ECCFCB;
      --brand-icon-bg:#E8C3C3;
      --color-border:#E0E0E0;
      --color-text-dark:#333333;
      --color-text-alt:#555555;
      --color-text-muted:#666666;
      --color-text-deep:#382325;

      --font-header:"Playfair Display",serif;
      --font-brand:"Platypi",serif;
      --font-button:"Platypi",serif;
      --font-nav:"Jost",sans-serif;
      --font-text:"Jost",sans-serif;

      --text-xs:.75rem;
      --text-sm:.875rem;
      --text-base:1rem;
      --text-md:1.1rem;
      --text-lg:1.35rem;
      --text-xl:1.6rem;
      --text-2xl:2rem;
      --text-3xl:2.5rem;

      --space-1:.25rem;
      --space-2:.5rem;
      --space-3:1rem;
      --space-4:1.2rem;
      --space-5:2rem;
      --space-6:5%;

      --radius-sm:4px;
      --radius-md:8px;
      --radius-lg:12px;
      --radius-xl:16px;
      --radius-pill:20px;
      --radius-full:50%;

      --shadow-sm:0 2px 10px rgba(0,0,0,.03);
      --shadow-md:0 4px 18px rgba(0,0,0,.03);
      --shadow-lg:0 14px 32px rgba(0,0,0,.12);
      --shadow-brand:0 4px 10px rgba(210,118,133,.2);
      --shadow-brand-hover:0 6px 15px rgba(210,118,133,.35);
      --shadow-focus:0 0 0 3px rgba(210,118,133,.15);
    }

    :root {
      --canvas: #1e1e1e;
      --pink-panel: #f3b4c0;
      --cream: #fff4ef;
      --pink-accent: #d9788a;
      --button: #db7f8e;
      --border: #e6b0bb;
      --text: #4a2a2e;
      --placeholder: #b5a0a4;
      --error: #b3263e;
      --font-header: "Playfair Display", Georgia, "Times New Roman", serif; /* headers */
      --font-button: "Platypi", Georgia, "Times New Roman", serif;          /* buttons + business name */
      --font-text: "Jost", "Helvetica Neue", Arial, sans-serif;             /* text + nav bar */
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 100%; min-height: 100vh; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
      background: var(--cream); color: var(--text); font-family: var(--font-text);
    }
/* Icon images are intentionally empty (src=""): fill in the path later. Hide the browser's broken-image glyph until then. */
    .logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
    img[src=""] { opacity: 0; }

    .stage { flex: 1; width: 100%; height: 100%; display: block; padding: 0; }

    /* The card is drawn at the Figma size (695 x 381) and scales with its width.
       1 "u" = 1 Figma pixel. */
    .frame { width: 100%; height: 100%; container-type: inline-size; }
    .card {
      --u: calc(100cqw / 695);
      display: grid; grid-template-columns: 1fr 1fr;
      height: 100%; min-height: 100vh;
      border-radius: 0;
      overflow: hidden; background: var(--cream);
    }

    /* ---------- Left panel ---------- */
    .brand {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding-top: calc(var(--u) * 100);
      background: var(--pink-panel);
      border-bottom-right-radius: 0;
    }
    .logo { width: calc(var(--u) * 103); height: calc(var(--u) * 103); border-radius: 50%; overflow: hidden; background: #fbe3e7; }
    .brand h2 {
      margin-top: calc(var(--u) * 10); line-height: calc(var(--u) * 18);
      font-family: var(--font-header); font-size: calc(var(--u) * 16); font-weight: 700;
    }
    .brand p {
      margin-top: calc(var(--u) * 10); line-height: calc(var(--u) * 16);
      font-size: calc(var(--u) * 13.5); font-weight: 500; white-space: nowrap;
    }

    /* ---------- Right panel ---------- */
    .form-side { padding: calc(var(--u) * 58) calc(var(--u) * 50) calc(var(--u) * 28) calc(var(--u) * 47); }
    .eyebrow {
      display: block; line-height: calc(var(--u) * 12);
      font-size: calc(var(--u) * 11.5); font-weight: 500; color: var(--pink-accent);
    }
    h1 { line-height: calc(var(--u) * 18); font-family: var(--font-header); font-size: calc(var(--u) * 16); font-weight: 700; }

    .message { display: none; margin-top: calc(var(--u) * 8); padding: calc(var(--u) * 6) calc(var(--u) * 10); border-radius: calc(var(--u) * 8); font-size: calc(var(--u) * 11.5); font-weight: 500; }
    .message.success { display: block; background: #e6f4ea; color: #1e6b3a; }
    .message.fail { display: block; background: #fde8ec; color: var(--error); }

    form { margin-top: calc(var(--u) * 14); }
    .field { margin-bottom: calc(var(--u) * 15); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 8); }
    .row .field { margin-bottom: 0; }
    label { display: block; margin-bottom: calc(var(--u) * 2); line-height: calc(var(--u) * 12); font-size: calc(var(--u) * 11.5); font-weight: 600; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; height: calc(var(--u) * 30);
      padding: 0 calc(var(--u) * 14);
      font: 500 calc(var(--u) * 13.5) var(--font-text); color: var(--text);
      background: #fff8f5;
      border: max(1px, calc(var(--u) * 1)) solid var(--border);
      border-radius: calc(var(--u) * 9);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: var(--placeholder); opacity: 1; }
    #password::placeholder, #confirm::placeholder { color: #6d6567; }
    .row input { padding: 0 calc(var(--u) * 10); }
    input:focus-visible { border-color: var(--pink-accent); box-shadow: 0 0 0 calc(var(--u) * 2.5) rgba(217, 120, 138, .28); }
    input.is-valid { border-color: #86c69b; }
    input[aria-invalid="true"] { border-color: var(--error); }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    .error { display: block; margin-top: calc(var(--u) * 3); color: var(--error); font-size: calc(var(--u) * 10.5); font-weight: 500; line-height: 1.25; }
    .error:empty { display: none; }

    .submit {
      display: block; width: 100%; height: calc(var(--u) * 31); margin-top: calc(var(--u) * 28);
      border: 0; border-radius: 999px; background: var(--button); color: #fff;
      font: 600 calc(var(--u) * 12) var(--font-button); cursor: pointer; transition: background .15s;
    }
    .submit:hover { background: #cf6c7d; }
    .submit:focus-visible { outline: 3px solid rgba(217, 120, 138, .5); outline-offset: 2px; }
    .submit:disabled { opacity: .7; cursor: wait; }

    .alt { margin-top: calc(var(--u) * 9); text-align: center; line-height: calc(var(--u) * 14); font-size: calc(var(--u) * 12.5); font-weight: 600; }
    .alt a { color: var(--pink-accent); text-decoration: none; }
    .alt a:hover { text-decoration: underline; }


    .field.tight { margin-bottom: calc(var(--u) * 12); }
    .remember-row { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 8); min-height: calc(var(--u) * 16); }
    .remember { display: flex; align-items: center; gap: calc(var(--u) * 8); margin: 0; padding-left: calc(var(--u) * 5); line-height: calc(var(--u) * 16); font-size: calc(var(--u) * 12.5); font-weight: 600; cursor: pointer; }
    input[type="checkbox"] {
      appearance: none; -webkit-appearance: none; flex: none; display: grid; place-content: center;
      width: calc(var(--u) * 16); height: calc(var(--u) * 16); margin: 0; padding: 0; cursor: pointer;
      border: max(1px, calc(var(--u) * 1)) solid #c9aeb3; border-radius: calc(var(--u) * 3); background: #fff;
    }
    input[type="checkbox"]::after { content: ""; width: calc(var(--u) * 8); height: calc(var(--u) * 4.5); border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
    input[type="checkbox"]:checked { background: var(--button); border-color: var(--button); }
    input[type="checkbox"]:checked::after { opacity: 1; }
    .forgot { color: var(--pink-accent); font-size: calc(var(--u) * 12); font-weight: 600; text-decoration: none; }
    .forgot:hover { text-decoration: underline; }

    /* ---------- Phones: stack the panels ---------- */
    @media (max-width: 720px) {
      .stage { padding: 0; }
      .card { --u: 1.35px; grid-template-columns: 1fr; min-height: 0; height: 100%; border-radius: 0; }
      .brand { padding: 36px 20px 32px; border-radius: 0 0 26px 26px; }
      .logo { width: 110px; height: 110px; }
      .form-side { padding: 28px 22px 26px; }
      .brand p { white-space: normal; }
      .brand p br { display: none; }
}
    @media (max-width: 440px) {

    /* R&R Sweet Bites Design System v1.1 */
    html,body{
      background:var(--bg-main);
      color:var(--color-text-dark);
      font-family:var(--font-text);
    }

    .stage,
    .login-card,
    .page,
    main{
      background:var(--bg-main);
    }

    h1,.hero-title,.section-title{
      font-family:var(--font-header);
      color:var(--color-text-deep);
    }

    .brand,
    .nav-name,
    .logo,
    .brand-name{
      font-family:var(--font-brand);
    }

    label,
    input,
    .remember,
    .forgot,
    .message,
    .helper{
      font-family:var(--font-text);
    }

    input[type="email"],
    input[type="password"],
    input[type="text"]{
      background:var(--bg-card);
      color:var(--color-text-dark);
      border:1px solid var(--color-border);
      border-radius:var(--radius-md);
      font-family:var(--font-text);
      font-size:var(--text-base);
      padding:.75rem 1rem;
      box-shadow:none;
    }

    input[type="email"]:focus,
    input[type="password"]:focus,

    button.submit{
      background:var(--color-primary);
      color:#fff;

    }

    .submit:hover,

    }

    .forgot{
      color:var(--color-primary);
      font-size:var(--text-base);

    }

    .forgot:hover{
      color:var(--color-primary-hover);
    }

    .remember{
      color:var(--color-text-dark);

    }

    .message{
      color:var(--color-text-muted);

    /* Left Admin panel */
    .left-panel,

      background:var(--bg-placeholder);

    .left-panel h2,

    .hero-panel h2{

    .hero-panel p{

    /* Preserve the full-page structure */

    .login-card{
      border-radius:0 !important;

      .left-panel h2,
      .brand-panel h2,

        font-size:var(--text-lg);
      }

    /* Admin Login reference-position adjustment */
    .login-card,
    .stage,
    .page{
      min-height:100vh;
    }

    .right-panel,
    .login-panel,
    .form-panel{
      display:flex;
      align-items:center;

    }

    .login-form,
    .login-content,

    .login-form h1,
    .login-content h1,
    .form-wrap h1,

    @media (min-width:701px){

    @media (max-width:700px){
      .login-form,

      .form-wrap,
      .auth-form{
        width:calc(100% - 2rem);

      }

    /* Admin Login hierarchy */
    .eyebrow{
      display:block;
      margin:0 0 .2rem;
      font-family:var(--font-text);
      font-size:var(--text-md);

      color:var(--color-primary);

    h1{
      margin-top:0;

      font-size:var(--text-xl);
      font-weight:700;
      line-height:1.2;
      color:var(--color-text-deep);

    /* Password Reset popup */
    .password-reset-overlay{
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:1.25rem;
      background:rgba(51,51,51,.62);
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity .18s ease, visibility .18s ease;
    }

    .password-reset-overlay.show{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .password-reset-modal{
      width:min(478px, 100%);
      min-height:295px;
      box-sizing:border-box;
      padding:3rem 1.5rem 1.25rem;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-align:center;
      background:var(--bg-placeholder);
      border:1px solid var(--color-primary);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow-lg);
    }

    .password-reset-modal h2{
      margin:0;
      font-family:var(--font-header);
      font-size:var(--text-3xl);
      line-height:1.15;
      font-weight:700;
      color:var(--color-text-deep);
    }

    .password-reset-modal p{
      margin:1.25rem 0 2.35rem;
      font-family:var(--font-text);
      font-size:var(--text-lg);
      line-height:1.35;
      font-weight:500;
      color:#7f6964;
    }

    .password-reset-okay{
      min-width:247px;
      background:var(--color-primary);
      color:#fff;
      border:1px solid transparent;
      border-radius:var(--radius-pill);
      padding:.6rem 1.5rem;
      font-family:var(--font-button);
      font-size:var(--text-xl);
      font-weight:600;
      box-shadow:var(--shadow-brand);
      cursor:pointer;
      transition:.2s ease;
    }

    .password-reset-okay:hover{
      background:var(--color-primary-hover);
      box-shadow:var(--shadow-brand-hover);
    }

    .password-reset-okay:focus-visible{
      outline:none;
      box-shadow:var(--shadow-focus), var(--shadow-brand);
    }

    @media (max-width:700px){
      .password-reset-modal{
        min-height:250px;
        padding:2.25rem 1.25rem 1.1rem;
      }

      .password-reset-modal h2{
        font-size:var(--text-2xl);
      }

      .password-reset-modal p{
        font-size:var(--text-md);
      }

      .password-reset-okay{
        min-width:210px;
        font-size:var(--text-lg);
      }
    }


    /* Password show/hide toggle */
    .password-field{
      position:relative;
      width:100%;
    }

    .password-field input{
      width:100%;
      box-sizing:border-box;
      padding-right:3rem !important;
    }

    .password-toggle{
      position:absolute;
      top:50%;
      right:.85rem;
      transform:translateY(-50%);
      width:1.8rem;
      height:1.8rem;
      display:grid;
      place-items:center;
      padding:0;
      border:0;
      background:transparent;
      color:#8f7772;
      cursor:pointer;
      border-radius:var(--radius-sm);
    }

    .password-toggle:hover{
      color:var(--color-primary);
      background:rgba(210,118,133,.06);
    }

    .password-toggle:focus-visible{
      outline:none;
      box-shadow:var(--shadow-focus);
    }

    .password-eye{
      position:relative;
      display:block;
      width:1.05rem;
      height:.68rem;
      border:1.6px solid currentColor;
      border-radius:55% 55% 50% 50%;
      transform:rotate(0deg);
    }

    .password-eye::after{
      content:"";
      position:absolute;
      width:.28rem;
      height:.28rem;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      border:1.4px solid currentColor;
      border-radius:50%;
      background:transparent;
    }

    .password-toggle.is-visible .password-eye{
      border-radius:50%;
      width:.82rem;
      height:.82rem;
    }

    .password-toggle.is-visible .password-eye::after{
      width:.3rem;
      height:.3rem;
      background:currentColor;
      border:0;
    }

    @media (max-width:700px){
      .password-toggle{
        right:.7rem;
      }
    }

</style>

<div class="stage">
    <div class="frame">
      <main class="card">
        <section class="brand">
          <div class="logo"><img src="" alt=""></div>
          <h2>Shop Owner Access</h2>
          <p>Manage requests, quotations,<br>schedules, payments, and gallery<br>content.</p>
        </section>

        <section class="form-side">
          <span class="eyebrow">Admin Login</span>
          <h1>R&amp;R Admin Portal</h1>

          <div id="message" class="message" role="status" aria-live="polite"></div>

          <form id="loginForm" method="post" action="#" novalidate>
            <div class="field">
              <label for="email">Email Address</label>
              <input id="email" name="email" type="email" placeholder="admin@email.com" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required>
              <span class="error" id="email-error"></span>
            </div>
            <div class="field tight">
              <label for="password">Password</label>
              <div class="password-field">
      <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" maxlength="64" required>
      <button type="button" class="password-toggle" id="passwordToggle"
              aria-label="Show password" aria-pressed="false">
        <span class="password-eye" aria-hidden="true"></span>
      </button>
    </div>
              <span class="error" id="password-error"></span>
            </div>
            <div class="remember-row">
              <label class="remember" for="remember"><input id="remember" name="remember" type="checkbox">Remember me</label>
              <a class="forgot" id="forgot" href="#">Forgot password?</a>
            </div>
            <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
            <button class="submit" type="submit">Log In</button>
          </form>

          
        </section>
      </main>
    </div>
  </div>

  <script>
/**
 * R&R Sweet Bites - Admin Login
 * Backend login: PHP + MySQL
 * Validation, attempt lock-out, remember-me, bot trap.
 */
(function () {
  "use strict";

  const DASHBOARD_URL = ""; // Example: "dashboard.html"
  const SESSION_KEY = "rr_session";
  const REMEMBER_KEY = "rr_remembered_email";
  const MAX_ATTEMPTS = 5, LOCK_SECONDS = 30;

  const $ = (id) => document.getElementById(id);
  const form = $("loginForm"), messageBox = $("message"), submitBtn = form.querySelector(".submit");
  const fields = ["email", "password"];
  const dirty = {};
  let failedAttempts = 0, lockedUntil = 0;

  /* ---------- Storage helper ---------- */
  function read(store, key) {
    try { return store.getItem(key); }
    catch (e) { return null; }
  }

  /* ---------- Validation ---------- */
  const EMAIL_RE = /^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$/;
  const rules = {
    email(v) {
      if (!v) return "Enter your email address.";
      if (/\s/.test(v)) return "Email can't contain spaces.";
      if (v.length > 254) return "Email is too long.";
      const at = v.indexOf("@");
      if (at < 1 || at !== v.lastIndexOf("@")) return "Email needs one @, like you@email.com.";
      if (v.slice(0, at).length > 64) return "Part before @ is too long.";
      if (!EMAIL_RE.test(v) || v.includes("..") || !/\.[A-Za-z]{2,}$/.test(v)) return "Enter a valid email, like you@email.com.";
    },
    password(v) {
      if (!v) return "Enter your password.";
      if (v.length > 64) return "Password is too long.";
    }
  };

  const getValues = () => ({
    email: $("email").value.trim().toLowerCase(),
    password: $("password").value
  });

  function showError(id, msg) {
    const input = $(id);
    $(id + "-error").textContent = msg || "";
    input.setAttribute("aria-invalid", msg ? "true" : "false");
    if (msg) input.setAttribute("aria-describedby", id + "-error");
    else input.removeAttribute("aria-describedby");
  }

  function validateField(id) {
    const msg = rules[id](getValues()[id]);
    showError(id, msg);
    return !msg;
  }

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message " + type;
  }

  /* ---------- Typing filters + live validation ---------- */
  $("email").addEventListener("input", (e) => {
    const clean = e.target.value.replace(/\s/g, "");
    if (clean !== e.target.value) e.target.value = clean;
  });

  $("email").addEventListener("blur", (e) => {
    e.target.value = e.target.value.trim().toLowerCase();
  });

  fields.forEach((id) => {
    const input = $(id);
    input.addEventListener("input", () => {
      dirty[id] = true;
      if (input.getAttribute("aria-invalid") === "true") validateField(id);
    });
    input.addEventListener("blur", () => {
      if (dirty[id] || input.value) validateField(id);
    });
  });

  /* ---------- Remember me: pre-fill the saved email ---------- */
  const saved = read(localStorage, REMEMBER_KEY);
  if (saved) {
    $("email").value = saved;
    $("remember").checked = true;
  }

  $("forgot").addEventListener("click", (e) => {
    e.preventDefault();
    const modal = document.getElementById("passwordResetModal");
    if (modal) {
      modal.style.display = "flex";
      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
      document.getElementById("passwordResetOkay").focus();
    }
  });

  /* ---------- Submit ---------- */
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    messageBox.className = "message";

    const wait = Math.ceil((lockedUntil - Date.now()) / 1000);
    if (wait > 0) {
      return showMessage("Too many attempts. Try again in " + wait + " seconds.", "fail");
    }

    if (form.website && form.website.value) {
      return showMessage("Invalid email or password.", "fail");
    }

    if (fields.map(validateField).includes(false)) {
      document.querySelector('[aria-invalid="true"]').focus();
      return;
    }

    const { email, password } = getValues();
    submitBtn.disabled = true;

    try {
      /* Send the credentials to PHP. PHP is responsible for checking MySQL
         and verifying the password hash. */
      const response = await fetch("login.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({ email, password })
      });

      const resultText = await response.text();
      let result = null;

      try {
        result = JSON.parse(resultText);
      } catch (parseError) {
        // Supports the temporary plain-text PHP response while testing.
      }

      const loginSucceeded = result
        ? result.success === true
        : resultText.startsWith("Login successful!");

      if (!response.ok || !loginSucceeded) {
        failedAttempts++;

        if (failedAttempts >= MAX_ATTEMPTS) {
          failedAttempts = 0;
          lockedUntil = Date.now() + LOCK_SECONDS * 1000;
          return showMessage("Too many attempts. Try again in " + LOCK_SECONDS + " seconds.", "fail");
        }

        $("password").value = "";
        return showMessage("Invalid email or password.", "fail");
      }

      failedAttempts = 0;

      /* PHP should return these values as JSON. */
      const user = result || {
        id: null,
        role: "admin",
        fullName: "R&R Admin",
        email: email
      };

      const remember = $("remember").checked;
      const session = JSON.stringify({
        id: user.id,
        role: user.role,
        fullName: user.fullName,
        email: user.email || email,
        createdAt: new Date().toISOString()
      });

      try {
        (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, session);
        (remember ? sessionStorage : localStorage).removeItem(SESSION_KEY);

        if (remember) {
          localStorage.setItem(REMEMBER_KEY, email);
        } else {
          localStorage.removeItem(REMEMBER_KEY);
        }
      } catch (err) {
        /* Storage blocked: continue without saving the session. */
      }

      const firstName = (user.fullName || "Admin").split(" ")[0];
      showMessage("Welcome back, " + firstName + "!", "success");

      if (DASHBOARD_URL) {
        setTimeout(() => {
          window.location.href = DASHBOARD_URL;
        }, 1000);
      }
    } catch (err) {
      showMessage("Unable to connect to the server. Please try again.", "fail");
    } finally {
      submitBtn.disabled = false;
    }
  });
})();

</script>

  <div class="password-reset-overlay" id="passwordResetModal"
       aria-hidden="true" role="dialog" aria-modal="true"
       aria-labelledby="passwordResetTitle">
    <div class="password-reset-modal">
      <h2 id="passwordResetTitle">Password Reset</h2>
      <p>Check your email for the password reset link</p>
      <button type="button" id="passwordResetOkay" class="password-reset-okay">Okay</button>
    </div>
  </div>


  <script>
    (function () {
      const modal = document.getElementById("passwordResetModal");
      const okay = document.getElementById("passwordResetOkay");
      const forgot = document.getElementById("forgot");

      if (!modal || !okay || !forgot) return;

      function closePasswordReset() {
        modal.classList.remove("show");
        modal.setAttribute("aria-hidden", "true");
        modal.style.display = "none";
      }

      function openPasswordReset() {
        modal.style.display = "flex";
        requestAnimationFrame(() => modal.classList.add("show"));
        modal.setAttribute("aria-hidden", "false");
        okay.focus();
      }

      forgot.addEventListener("click", function (e) {
        e.preventDefault();
        openPasswordReset();
      });

      okay.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        closePasswordReset();
      });

      modal.addEventListener("click", function (e) {
        if (e.target === modal) closePasswordReset();
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modal.classList.contains("show")) {
          closePasswordReset();
          forgot.focus();
        }
      });
    })();
  </script>


  <script>
    (function () {
      const password = document.getElementById("password");
      const toggle = document.getElementById("passwordToggle");

      if (!password || !toggle) return;

      toggle.addEventListener("click", function () {
        const showing = password.type === "text";

        password.type = showing ? "password" : "text";
        toggle.classList.toggle("is-visible", !showing);
        toggle.setAttribute("aria-pressed", String(!showing));
        toggle.setAttribute(
          "aria-label",
          showing ? "Show password" : "Hide password"
        );
      });
    })();
  </script>

</body>
</html>
