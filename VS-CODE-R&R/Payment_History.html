<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R&amp;R Sweet Bites – Payment History</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Platypi:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#FAF0E6;--card:#FFFFFF;--pink:#D27685;--pink-hover:#BE5B6C;--pink-soft:#F2D5D5;--rose:#E0E0E0;--brown:#333333;--brown-deep:#382325;--muted:#666666;--muted-alt:#555555;--line:#E0E0E0;--avatar-bg:#E8C3C3;--footer-bg:#ECCFCB;--ok:#5c8f63;--warn:#c98a3c;--bad:#c0525a;--text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;--text-md:1.1rem;--text-lg:1.35rem;--text-xl:1.6rem;--text-2xl:2rem;--text-3xl:2.5rem;--space-1:.25rem;--space-2:.5rem;--space-3:1rem;--space-4:1.2rem;--space-5:2rem;--radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-pill:20px;--radius-full:50%;--shadow-sm:0 2px 10px rgba(0,0,0,.03);--shadow-md:0 4px 18px rgba(0,0,0,.03);--shadow-lg:0 14px 32px rgba(0,0,0,.12);--shadow-brand:0 4px 10px rgba(210,118,133,.2);--shadow-brand-hover:0 6px 15px rgba(210,118,133,.35);--shadow-focus:0 0 0 3px rgba(210,118,133,.15)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Jost',system-ui,sans-serif;background:var(--bg);color:var(--brown);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;color:var(--brown-deep)}
a{color:inherit;text-decoration:none}
button{font-family:'Platypi',Georgia,serif;font-size:var(--text-base);cursor:pointer}
input,select,textarea{font-family:'Jost',system-ui,sans-serif}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* Navigation */
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--pink-soft)}
.nav{max-width:1100px;margin:auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Platypi',Georgia,serif;font-weight:700;color:var(--pink);font-size:var(--text-lg)}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:transparent;display:block}
.links{display:flex;gap:22px;justify-content:center;font-weight:500;font-family:'Jost',system-ui,sans-serif;font-size:var(--text-base)}
.links a{padding:4px 0;border-bottom:2px solid transparent;transition:.2s}
.links a:hover,.links a.active{border-color:var(--pink);color:var(--pink)}
.tools{display:flex;align-items:center;gap:14px}
.bell{position:relative;background:transparent;border:0;padding:0;width:28px;height:28px}
.bell img{width:28px;height:28px;display:block;background:transparent;object-fit:contain}
.bell b{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;font-size:var(--text-xs);border-radius:var(--radius-full);width:16px;height:16px;display:grid;place-items:center}
.avatar{width:44px;height:44px;border-radius:var(--radius-full);background:var(--avatar-bg);border:0;font-weight:600}
.burger{display:none;background:none;border:0;font-size:1.6rem;color:var(--brown)}
@media(max-width:820px){
 h2.title{font-size:var(--text-2xl)}
 .nav{display:flex}
 .burger{display:block;margin-left:auto}
 .links{position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--pink-soft);max-height:0;overflow:hidden;transition:max-height .3s}
 .links.open{max-height:320px}
 .links a{padding:14px 20px;border:0;border-top:1px solid var(--pink-soft)}
}

@keyframes rise{from{opacity:0;transform:translateY(18px)}}

main{flex:1;width:100%;max-width:1100px;margin:auto;padding:28px 20px 60px}
.page{display:none}.page.show{display:block;animation:rise .4s both}
h2.title{font-size:var(--text-3xl);margin-bottom:4px}
.sub{font-size:var(--text-sm);color:var(--muted);margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--rose);border-radius:var(--radius-lg);padding:var(--space-3);box-shadow:var(--shadow-md)}

/* Detail */
.back{display:inline-block;border:1px solid var(--pink);color:var(--pink);background:none;border-radius:var(--radius-pill);padding:5px 14px;font-size:var(--text-xs);margin-bottom:10px}
.crumb{font-size:var(--text-xs);color:var(--muted);margin-bottom:10px}
.tabs{display:flex;gap:26px;margin:16px 0 20px;border-bottom:1px solid var(--pink-soft)}
a.tab{font-family:'Platypi',Georgia,serif}
.tab{background:none;border:0;padding:8px 2px;font-weight:500;color:var(--brown);border-bottom:2px solid transparent}
.tab.on{color:var(--pink);border-color:var(--pink)}
.panel{display:none}.panel.on{display:block}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-md)}
table{width:100%;border-collapse:collapse;min-width:560px}
th{background:var(--pink-soft);color:var(--brown-deep);text-align:left;padding:14px;font-size:var(--text-sm)}
td{padding:16px 14px;border-top:1px solid var(--line);font-size:var(--text-sm)}
.bal{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.bal div{background:var(--bg);border-radius:var(--radius-lg);padding:var(--space-3)}
.bal small{color:var(--muted);font-size:var(--text-xs)}.bal strong{display:block;font-size:var(--text-lg)}
.bar{height:10px;background:var(--pink-soft);border-radius:var(--radius-pill);overflow:hidden;margin-bottom:6px}
.bar span{display:block;height:100%;background:var(--pink);transition:width .8s}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}

footer{background:var(--footer-bg);text-align:center;padding:22px;font-size:var(--text-sm);color:var(--brown-deep)}
footer strong{display:block;font-weight:500;margin-bottom:6px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,100px);background:var(--brown-deep);color:#fff;padding:12px 22px;border-radius:var(--radius-lg);transition:.4s;z-index:99;font-size:var(--text-sm);box-shadow:var(--shadow-lg)}
#toast.on{transform:translate(-50%,0)}
#top{position:fixed;right:18px;bottom:18px;width:42px;height:42px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:1.1rem;opacity:0;pointer-events:none;transition:.3s}
#top.on{opacity:1;pointer-events:auto}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{box-shadow:var(--shadow-focus)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
 <nav class="nav" aria-label="Main">
  <a class="brand" href="Customer_Orders.html"><img class="logo" src="R&amp;R_logo.jpg" alt="R&amp;R Sweet Bites logo"><span>R&amp;R Sweet Bites</span></a>
  <button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false">☰</button>
  <div class="links" id="links">
   <a href="home.html">Home</a><a href="gallery.html">Gallery</a><a href="submit-request.html">Submit Request</a>
   <a href="Customer_Orders.html" class="active">My Order</a><a href="messages.html">Messages</a>
  </div>
  <div class="tools">
   <button class="bell" aria-label="Notifications" id="bell"><img src="VS-CODE-R&R\Images-Icons\bell-icon.png" alt=""><b id="notif">2</b></button>
   <button class="avatar" aria-label="Account">AP</button>
  </div>
 </nav>
</header>


<main>
 <section class="page show" id="page-detail">
  <a class="back" href="Customer_Orders.html">← Back to my Orders</a>
  <p class="crumb">My Orders / Payment History</p>
  <h2 class="title" id="dTitle"></h2>
  <p class="sub" id="dSub"></p>
  <div class="tabs"><a class="tab" id="tabBal" href="#">Payment &amp; Balance</a><a class="tab on" id="tabHist" href="#">Payment History</a></div>
  <div class="panel on" id="tab-hist">
   <div class="card">
    <h3 style="font-size:1.5rem;margin-bottom:14px">Payment History</h3>
    <div class="tablewrap"><table>
     <thead><tr><th>DATE</th><th>TYPE</th><th>METHOD</th><th>REFERENCE</th><th>AMOUNT</th><th>STATUS</th></tr></thead>
     <tbody id="hist"></tbody>
    </table></div>
   </div>
  </div>
 </section>
</main>

<footer><strong>ABOUT US</strong>© 2019 R&amp;R Sweet Bites. All Rights Reserved.</footer>
<button id="top" aria-label="Back to top">↑</button>
<div id="toast" role="status"></div>

<script>
/* ---------- Data (in a real system this comes from the server) ---------- */
const peso = n => '₱' + n.toLocaleString('en-PH', {minimumFractionDigits:2});
const SEED = [
 {id:'RQ-2039',title:'2-Tier Custom Birthday Cake',customer:'Alexahe Bamamada',occasion:'Birthday',total:9000,paid:0,level:'Moderate',due:'Nov 18, 2026',status:'Awaiting Downpayment',payments:[]},
 {id:'RQ-2040',title:'Classic 1-Tier Wedding Cake',customer:'Hannah Reyes',occasion:'Wedding',total:15000,paid:3000,level:'Luxury',due:'Oct 29, 2026',status:'In Progress',payments:[
   {date:'2026-08-30',type:'20% Downpayment',method:'GCash',ref:'GCASH-1122334455',amount:3000,status:'Verified'}]},
 {id:'RQ-2041',title:'2-Tier Custom Birthday Cake',customer:'Alexahe Bamamada',occasion:'Birthday',total:9000,paid:1800,level:'Moderate',due:'Sep 30, 2026',status:'Pending Verification',payments:[
   {date:'2026-09-18',type:'20% Downpayment',method:'GCash',ref:'GCASH-1122334455',amount:1800,status:'Pending Verification'}]},
 {id:'RQ-2035',title:'Cupcake Box (24 pcs)',customer:'Alexahe Bamamada',occasion:'Anniversary',total:3600,paid:3600,level:'Low',due:'Sep 05, 2026',status:'Completed',payments:[
   {date:'2026-08-20',type:'20% Downpayment',method:'Bank Transfer',ref:'BDO-99881122',amount:720,status:'Verified'},
   {date:'2026-09-03',type:'Balance',method:'GCash',ref:'GCASH-5566778899',amount:2880,status:'Verified'}]},
 {id:'RQ-2031',title:'Number 7 Shaped Cake',customer:'Alexahe Bamamada',occasion:'Birthday',total:2800,paid:2800,level:'Low',due:'Aug 12, 2026',status:'Completed',payments:[
   {date:'2026-07-30',type:'Full Payment',method:'Cash',ref:'-',amount:2800,status:'Verified'}]}
];
const paid = o => o.payments.filter(p => p.status === 'Verified').reduce((t, p) => t + p.amount, 0);   // FR-18
const STATUSES = ['Awaiting Downpayment','Pending Verification','In Progress','Completed','Cancellation Requested'];
const CANCELLABLE = ['Awaiting Downpayment','Pending Verification','In Progress'];   // FR-25 precondition
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
let current = null;


/* Orders are saved in the browser so all three pages share the same data */
let orders = [];
async function api(url, opts){
  try { const r = await fetch(url, opts); return await r.json(); }
  catch(e){ return {error:'Cannot reach the server.'}; }
}
async function loadOrders(){ const d = await api('api/orders.php'); orders = Array.isArray(d) ? d : []; }
const pillClass = s => s === 'Completed' || s === 'Verified' ? 'ok' : s.includes('Cancel') || s === 'Rejected' ? 'bad' : 'warn';
const orderId = new URLSearchParams(location.search).get('id');

function renderHeader(o){
 $('#dTitle').textContent = 'Order #' + o.id;
 $('#dSub').textContent = o.title + ' · ' + o.occasion;
 $('#tabBal').href = 'Payment_Balance.html?id=' + o.id;
 $('#tabHist').href = 'Payment_History.html?id=' + o.id;
}
function renderDetail(){
 const o = current; renderHeader(o);
 $('#hist').innerHTML = o.payments.length ? o.payments.map(p => `<tr><td>${p.date}</td><td>${p.type}</td><td>${p.method}</td><td>${p.ref}</td><td>${peso(p.amount)}</td><td><span class="pill ${pillClass(p.status)}">${p.status}</span></td></tr>`).join('')
  : '<tr><td colspan="6" class="empty">No payments yet. Submit your 20% downpayment to confirm the order.</td></tr>';
}

/* ---------- Input rules: block wrong characters while typing (works for paste too) ---------- */
const BLOCK = {digits:/\D/g, letters:/[^A-Za-z\u00C0-\u024F\s.'-]/g, ref:/[^A-Za-z0-9-]/g, search:/[^A-Za-z0-9\s#-]/g};
document.addEventListener('input', e => {
 const f = e.target.dataset && e.target.dataset.filter; if(!f) return;
 let v = e.target.value.replace(BLOCK[f], '');
 if(f === 'ref') v = v.toUpperCase();
 if(f === 'letters') v = v.replace(/^\s+/, '').replace(/\s{2,}/g, ' ');
 if(v !== e.target.value) e.target.value = v;
});
function validate(rules, id){
 const el = $('#' + id), r = rules[id](el.value), ok = r === true;
 el.classList.toggle('invalid', !ok);
 const err = el.nextElementSibling; if(err && err.classList.contains('err')) err.textContent = ok ? '' : r;
 return ok;
}

/* ---------- Shared UI: nav, toast, back-to-top ---------- */
$('#burger').onclick = () => {
 const open = $('#links').classList.toggle('open'); $('#burger').setAttribute('aria-expanded', open);
};
$('#bell').onclick = () => { $('#notif').style.display = 'none'; toast('Order status updates will appear here.'); };
$$('.links a:not([data-nav])').forEach(a => a.addEventListener('click', () => {}));
let t; function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(t); t = setTimeout(() => el.classList.remove('on'), 2800); }
addEventListener('scroll', () => $('#top').classList.toggle('on', scrollY > 300));
$('#top').onclick = () => scrollTo({top:0, behavior:'smooth'});
loadOrders().then(() => {
  current = orders.find(o => o.id === orderId);
  if(!current) return location.href = 'Customer_Orders.html';
  renderDetail();
  // hide the Payment & Balance tab when the order is finished or cancelled
  const closed = ['Completed','Cancelled','Cancellation Requested'].includes(current.status) || current.total - paid(current) <= 0;
  if(closed) $('#tabBal').style.display = 'none';
});
</script>
</body>
</html>
