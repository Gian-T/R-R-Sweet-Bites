<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R&amp;R Sweet Bites – My Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Platypi:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#fff5f0;--card:#fff;--pink:#e8798b;--pink-soft:#f7dcdf;--rose:#f0d0cc;--brown:#4a2c2a;--muted:#8a6e6b;--line:#f0b8c0;--ok:#2e7d32;--warn:#b26a00;--bad:#c0525a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Jost',system-ui,sans-serif;background:var(--bg);color:var(--brown);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif}
a{color:inherit;text-decoration:none}
button{font-family:'Platypi',Georgia,serif;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:'Jost',system-ui,sans-serif}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* Navigation */
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--pink-soft)}
.nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:24px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Platypi',Georgia,serif;font-weight:700;color:var(--pink);font-size:1.25rem}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:transparent;display:block}
.links{display:flex;gap:22px;margin-left:auto;font-weight:500;font-family:'Jost',system-ui,sans-serif}
.links a{padding:4px 0;border-bottom:2px solid transparent;transition:.2s}
.links a:hover,.links a.active{border-color:var(--pink);color:var(--pink)}
.tools{display:flex;align-items:center;gap:14px}
.bell{position:relative;background:transparent;border:0;padding:0;width:28px;height:28px}
.bell img{width:28px;height:28px;display:block;background:transparent;object-fit:contain}
.bell b{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;font-size:.65rem;border-radius:50%;width:16px;height:16px;display:grid;place-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--pink-soft);border:0;font-weight:600}
.burger{display:none;background:none;border:0;font-size:1.6rem;color:var(--brown)}
@media(max-width:820px){
 .burger{display:block;margin-left:auto}
 .links{position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--pink-soft);max-height:0;overflow:hidden;transition:max-height .3s}
 .links.open{max-height:320px}
 .links a{padding:14px 20px;border:0;border-top:1px solid var(--pink-soft)}
}

/* Animated cover */
.cover{position:relative;overflow:hidden;background:linear-gradient(120deg,#f9c9d2,#fde4e8,#f7dcdf,#f9c9d2);background-size:300% 300%;animation:flow 10s ease infinite;padding:44px 20px;text-align:center}
.cover h1{font-size:clamp(1.8rem,5vw,2.8rem);animation:rise .8s both}
.cover p{color:var(--muted);animation:rise .8s .15s both}
.cover i{position:absolute;bottom:-20px;width:10px;height:10px;border-radius:50%;opacity:.7;animation:float linear infinite}
@keyframes flow{50%{background-position:100% 50%}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes float{to{transform:translateY(-200px) rotate(360deg);opacity:0}}

main{flex:1;width:100%;max-width:1100px;margin:auto;padding:28px 20px 60px}
.page{display:none}.page.show{display:block;animation:rise .4s both}
h2.title{font-size:1.9rem;margin-bottom:4px}
.sub{font-size:.85rem;color:var(--muted);margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--rose);border-radius:14px;padding:20px}

/* Orders list */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.stat small{display:block;font-size:.75rem;color:var(--muted)}
.stat strong{font-size:1.6rem}
.filters{display:flex;gap:16px;flex-wrap:wrap;background:#f7e5dd;padding:14px 18px;border-radius:10px;margin-bottom:24px;align-items:center}
.filters select,.filters input{padding:9px 14px;border:1px solid var(--rose);border-radius:20px;background:#fff;font:inherit;font-size:.85rem}
.filters input{flex:1;min-width:200px}
.order{font-family:'Jost',sans-serif;display:grid;grid-template-columns:90px 1fr auto auto 20px;gap:16px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--rose);border-radius:10px;padding:14px 18px;margin-bottom:14px;transition:.2s}
.order:hover{border-color:var(--pink);transform:translateX(3px)}
.order .id{color:var(--pink);font-weight:600;font-size:.85rem}
.order h3{font-size:1.05rem}
.order small{color:var(--muted);display:block;font-size:.78rem}
.date{font-weight:600;text-align:right}
.pill{display:inline-block;padding:4px 12px;border-radius:12px;font-size:.75rem;font-weight:600;background:var(--pink-soft)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.tag{padding:3px 12px;border-radius:12px;background:var(--pink-soft);color:var(--pink);font-size:.72rem}
.empty{text-align:center;color:var(--muted);padding:30px}
@media(max-width:700px){
 .stats{grid-template-columns:1fr}
 .order{grid-template-columns:1fr auto;grid-template-areas:"a b" "c c" "d e"}
 .order>:nth-child(1){grid-area:a}.order>:nth-child(2){grid-area:c}.order>:nth-child(3){grid-area:d}.order>:nth-child(4){grid-area:b;text-align:right}.order>:nth-child(5){display:none}
}

footer{background:#f0d0cc;text-align:center;padding:22px;font-size:.9rem;color:#6b4a47}
footer strong{display:block;font-weight:500;margin-bottom:6px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,100px);background:var(--brown);color:#fff;padding:12px 22px;border-radius:10px;transition:.4s;z-index:99}
#toast.on{transform:translate(-50%,0)}
#top{position:fixed;right:18px;bottom:18px;width:42px;height:42px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:1.1rem;opacity:0;pointer-events:none;transition:.3s}
#top.on{opacity:1;pointer-events:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
 <nav class="nav" aria-label="Main">
  <a class="brand" href="Customer_Orders.html"><img class="logo" src="R&amp;R_logo.jpg" alt="R&amp;R Sweet Bites logo"><span>R&amp;R Sweet Bites</span></a>
  <button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false">☰</button>
  <div class="links" id="links">
   <a href="home.html">Home</a><a href="gallery.html">Gallery</a><a href="submit-request.html">Submit Request</a>
   <a href="Customer_Orders.html" class="active">My Order</a><a href="messages.html">Messages</a>
  </div>
  <div class="tools">
   <button class="bell" aria-label="Notifications" id="bell"><img src="bell.png" alt=""><b id="notif">2</b></button>
   <button class="avatar" aria-label="Account">AP</button>
  </div>
 </nav>
</header>

<section class="cover" id="cover"><h1>My Cake Orders</h1><p>Every custom cake, one place.</p></section>

<main>
 <section class="page show" id="page-orders">
  <h2 class="title">My Cake Orders</h2>
  <p class="sub">Track your orders, payments and order status updates.</p>
  <div class="stats">
   <div class="card stat"><small>ACTIVE ORDERS</small><strong id="sActive">0</strong></div>
   <div class="card stat"><small>PENDING VERIFICATION</small><strong id="sPending">0</strong></div>
   <div class="card stat"><small>COMPLETED</small><strong id="sDone">0</strong></div>
  </div>
  <div class="filters">
   <strong style="font-size:.8rem">Filters:</strong>
   <select id="fStatus" aria-label="Filter by status"></select>
   <input id="fSearch" type="search" data-filter="search" maxlength="30" placeholder="Search order ID or cake type..." aria-label="Search orders">
  </div>
  <div id="list"></div>
 </section>
</main>

<footer><strong>ABOUT US</strong>© 2019 R&amp;R Sweet Bites. All Rights Reserved.</footer>
<button id="top" aria-label="Back to top">↑</button>
<div id="toast" role="status"></div>

<script>
/* ---------- Data (in a real system this comes from the server) ---------- */
const peso = n => '₱' + n.toLocaleString('en-PH', {minimumFractionDigits:2});
const SEED = [
 {id:'RQ-2039',title:'2-Tier Custom Birthday Cake',customer:'Alexahe Bamamada',occasion:'Birthday',total:9000,paid:0,level:'Moderate',due:'Nov 18, 2026',status:'Awaiting Downpayment',payments:[]},
 {id:'RQ-2040',title:'Classic 1-Tier Wedding Cake',customer:'Hannah Reyes',occasion:'Wedding',total:15000,paid:3000,level:'Luxury',due:'Oct 29, 2026',status:'In Progress',payments:[
   {date:'2026-08-30',type:'20% Downpayment',method:'GCash',ref:'GCASH-1122334455',amount:3000,status:'Verified'}]},
 {id:'RQ-2041',title:'2-Tier Custom Birthday Cake',customer:'Alexahe Bamamada',occasion:'Birthday',total:9000,paid:1800,level:'Moderate',due:'Sep 30, 2026',status:'Pending Verification',payments:[
   {date:'2026-09-18',type:'20% Downpayment',method:'GCash',ref:'GCASH-1122334455',amount:1800,status:'Pending Verification'}]},
 {id:'RQ-2035',title:'Cupcake Box (24 pcs)',customer:'Alexahe Bamamada',occasion:'Anniversary',total:3600,paid:3600,level:'Low',due:'Sep 05, 2026',status:'Completed',payments:[
   {date:'2026-08-20',type:'20% Downpayment',method:'Bank Transfer',ref:'BDO-99881122',amount:720,status:'Verified'},
   {date:'2026-09-03',type:'Balance',method:'GCash',ref:'GCASH-5566778899',amount:2880,status:'Verified'}]},
 {id:'RQ-2031',title:'Number 7 Shaped Cake',customer:'Alexahe Bamamada',occasion:'Birthday',total:2800,paid:2800,level:'Low',due:'Aug 12, 2026',status:'Completed',payments:[
   {date:'2026-07-30',type:'Full Payment',method:'Cash',ref:'-',amount:2800,status:'Verified'}]}
];
const paid = o => o.payments.filter(p => p.status === 'Verified').reduce((t, p) => t + p.amount, 0);   // FR-18
const STATUSES = ['Awaiting Downpayment','Pending Verification','In Progress','Completed','Cancellation Requested'];
const CANCELLABLE = ['Awaiting Downpayment','Pending Verification','In Progress'];   // FR-25 precondition
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
let current = null;


/* Orders are saved in the browser so all three pages share the same data */
function load(){ try{ const r = localStorage.getItem('rr_orders'); if(r) return JSON.parse(r); }catch(e){} return JSON.parse(JSON.stringify(SEED)); }
function save(){ try{ localStorage.setItem('rr_orders', JSON.stringify(orders)); }catch(e){} }
const orders = load();
const pillClass = s => s === 'Completed' || s === 'Verified' ? 'ok' : s.includes('Cancel') || s === 'Rejected' ? 'bad' : 'warn';
const orderId = new URLSearchParams(location.search).get('id');

/* ---------- Page 1: list ---------- */
$('#fStatus').innerHTML = '<option value="">All Status</option>' + STATUSES.map(s => `<option>${s}</option>`).join('');
function renderList(){
 const q = $('#fSearch').value.trim().toLowerCase(), st = $('#fStatus').value;
 $('#sActive').textContent  = orders.filter(o => ['In Progress','Awaiting Downpayment'].includes(o.status)).length;
 $('#sPending').textContent = orders.filter(o => o.status === 'Pending Verification').length;
 $('#sDone').textContent    = orders.filter(o => o.status === 'Completed').length;
 const rows = orders.filter(o => (!st || o.status === st) && (!q || (o.id + ' ' + o.title).toLowerCase().includes(q)));
 $('#list').innerHTML = rows.length ? rows.map(o => `
  <a class="order" href="Payment&amp;Balance.html?id=${o.id}">
   <span class="id">${o.id}</span>
   <span><h3>${o.title}</h3><small>${o.customer}</small><small>${o.occasion} · ${peso(o.total)} total · Remaining: ${peso(o.total - paid(o))}</small></span>
   <span class="tag">${o.level}</span>
   <span><span class="date">${o.due}</span><br><span class="pill ${pillClass(o.status)}">${o.status}</span></span>
   <span aria-hidden="true">›</span>
  </a>`).join('') : '<p class="empty">No orders match your filters.</p>';
}
$('#fStatus').onchange = $('#fSearch').oninput = renderList;


/* ---------- Input rules: block wrong characters while typing (works for paste too) ---------- */
const BLOCK = {digits:/\D/g, letters:/[^A-Za-z\u00C0-\u024F\s.'-]/g, ref:/[^A-Za-z0-9-]/g, search:/[^A-Za-z0-9\s#-]/g};
document.addEventListener('input', e => {
 const f = e.target.dataset && e.target.dataset.filter; if(!f) return;
 let v = e.target.value.replace(BLOCK[f], '');
 if(f === 'ref') v = v.toUpperCase();
 if(f === 'letters') v = v.replace(/^\s+/, '').replace(/\s{2,}/g, ' ');
 if(v !== e.target.value) e.target.value = v;
});
function validate(rules, id){
 const el = $('#' + id), r = rules[id](el.value), ok = r === true;
 el.classList.toggle('invalid', !ok);
 const err = el.nextElementSibling; if(err && err.classList.contains('err')) err.textContent = ok ? '' : r;
 return ok;
}

/* ---------- Shared UI: nav, toast, back-to-top, cover sprinkles ---------- */
$('#burger').onclick = () => {
 const open = $('#links').classList.toggle('open'); $('#burger').setAttribute('aria-expanded', open);
};
$('#bell').onclick = () => { $('#notif').style.display = 'none'; toast('Order status updates will appear here.'); };
$$('.links a:not([data-nav])').forEach(a => a.addEventListener('click', () => {}));
let t; function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(t); t = setTimeout(() => el.classList.remove('on'), 2800); }
addEventListener('scroll', () => $('#top').classList.toggle('on', scrollY > 300));
$('#top').onclick = () => scrollTo({top:0, behavior:'smooth'});
const colors = ['#f6b8c4','#fff','#f7c873','#e8798b'];
for(let i = 0; i < 18; i++){
 const s = document.createElement('i');
 s.style.cssText = `left:${Math.random()*100}%;background:${colors[i%4]};animation-duration:${4+Math.random()*6}s;animation-delay:${-Math.random()*8}s`;
 $('#cover').appendChild(s);
}
renderList();
</script>
</body>
</html>
