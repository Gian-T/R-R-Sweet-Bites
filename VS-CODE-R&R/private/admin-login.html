<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin log in | R&R Sweet Bites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Platypi:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #1e1e1e;
      --choco: #8b3a24;          /* left panel background — the deep brown in the screenshot */
      --cream: #fff4ef;          /* right panel background */
      --pink-accent: #d9788a;
      --button: #db7f8e;
      --border: #e6b0bb;
      --text: #4a2a2e;
      --placeholder: #b5a0a4;
      --error: #b3263e;
      --font-header: "Playfair Display", Georgia, "Times New Roman", serif;
      --font-button: "Platypi", Georgia, "Times New Roman", serif;
      --font-text: "Jost", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      background: var(--canvas); color: var(--text); font-family: var(--font-text);
    }

    .stage { flex: 1; display: grid; place-items: center; padding: 24px; }

    /* Card drawn at Figma size (961 x 441), scales with its container */
    .frame { width: min(100%, 1200px); container-type: inline-size; }
    .card {
      --u: calc(100cqw / 961);
      display: grid; grid-template-columns: 1fr 1fr;
      min-height: calc(var(--u) * 441);
      border-radius: calc(var(--u) * 14);
      overflow: hidden; background: var(--cream);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    /* ---------- Left panel ---------- */
    .brand {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: calc(var(--u) * 90) calc(var(--u) * 60) 0;
      background: var(--choco);
      color: #fff;
    }
    .logo {
      width: calc(var(--u) * 155); height: calc(var(--u) * 155);
      border-radius: 50%; overflow: hidden; background: #fbe3e7;
      display: grid; place-items: center;
    }
    .logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .brand h2 {
      margin-top: calc(var(--u) * 34); line-height: calc(var(--u) * 26);
      font-family: var(--font-header); font-size: calc(var(--u) * 22); font-weight: 700;
      color: #fff;
    }
    .brand p {
      margin-top: calc(var(--u) * 20); line-height: calc(var(--u) * 22);
      font-family: var(--font-header); font-size: calc(var(--u) * 16); font-weight: 500;
      color: rgba(255,255,255,0.92);
      max-width: calc(var(--u) * 380);
    }

    /* ---------- Right panel ---------- */
    .form-side {
      padding: calc(var(--u) * 96) calc(var(--u) * 60) calc(var(--u) * 40) calc(var(--u) * 60);
      display: flex; flex-direction: column; justify-content: flex-start;
    }
    .eyebrow {
      display: block; line-height: calc(var(--u) * 16);
      font-family: var(--font-text);
      font-size: calc(var(--u) * 15); font-weight: 600; color: var(--pink-accent);
      margin-bottom: calc(var(--u) * 4);
    }
    h1 {
      line-height: calc(var(--u) * 30);
      font-family: var(--font-header); font-size: calc(var(--u) * 26); font-weight: 700;
      color: var(--text);
      margin-bottom: calc(var(--u) * 30);
    }

    .message {
      display: none; margin-bottom: calc(var(--u) * 12);
      padding: calc(var(--u) * 8) calc(var(--u) * 14);
      border-radius: calc(var(--u) * 8);
      font-size: calc(var(--u) * 14); font-weight: 500;
    }
    .message.success { display: block; background: #e6f4ea; color: #1e6b3a; }
    .message.fail    { display: block; background: #fde8ec; color: var(--error); }

    .field { margin-bottom: calc(var(--u) * 20); }
    label {
      display: block; margin-bottom: calc(var(--u) * 6);
      line-height: calc(var(--u) * 16);
      font-size: calc(var(--u) * 14); font-weight: 600;
    }
    input[type="email"], input[type="password"] {
      width: 100%; height: calc(var(--u) * 44);
      padding: 0 calc(var(--u) * 16);
      font: 500 calc(var(--u) * 15) var(--font-text); color: var(--text);
      background: #fff;
      border: max(1px, calc(var(--u) * 1)) solid var(--border);
      border-radius: calc(var(--u) * 10);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: var(--placeholder); opacity: 1; }
    input:focus-visible {
      border-color: var(--pink-accent);
      box-shadow: 0 0 0 calc(var(--u) * 3) rgba(217, 120, 138, .22);
    }
    input[aria-invalid="true"] { border-color: var(--error); }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: calc(var(--u) * 50); }
    .pw-toggle {
      position: absolute; right: calc(var(--u) * 8); top: 50%; transform: translateY(-50%);
      display: grid; place-items: center;
      width: calc(var(--u) * 34); height: calc(var(--u) * 34);
      padding: 0; border: 0; border-radius: 50%;
      background: transparent; color: #a98a90; cursor: pointer;
      transition: color .15s, background .15s;
    }
    .pw-toggle:hover { color: var(--pink-accent); background: rgba(217, 120, 138, .14); }
    .pw-toggle:focus-visible { outline: 3px solid rgba(217, 120, 138, .5); outline-offset: 1px; }
    .pw-toggle svg { width: calc(var(--u) * 20); height: calc(var(--u) * 20); display: block; }
    .pw-toggle .icon-eye { display: none; }
    .pw-toggle[aria-pressed="true"] .icon-eye-off { display: none; }
    .pw-toggle[aria-pressed="true"] .icon-eye { display: block; }

    .error { display: block; margin-top: calc(var(--u) * 4); color: var(--error); font-size: calc(var(--u) * 12.5); font-weight: 500; line-height: 1.3; }
    .error:empty { display: none; }

    .remember-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: calc(var(--u) * 12);
      margin-bottom: calc(var(--u) * 30);
    }
    .remember {
      display: flex; align-items: center; gap: calc(var(--u) * 10);
      margin: 0; padding: 0;
      line-height: calc(var(--u) * 20);
      font-size: calc(var(--u) * 14); font-weight: 600;
      cursor: pointer;
    }
    input[type="checkbox"] {
      appearance: none; -webkit-appearance: none; flex: none;
      display: grid; place-content: center;
      width: calc(var(--u) * 20); height: calc(var(--u) * 20);
      margin: 0; padding: 0; cursor: pointer;
      border: max(1px, calc(var(--u) * 1)) solid #c9aeb3;
      border-radius: calc(var(--u) * 4); background: #fff;
    }
    input[type="checkbox"]::after {
      content: "";
      width: calc(var(--u) * 10); height: calc(var(--u) * 5.5);
      border-left: 2px solid #fff; border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translate(1px, -1px); opacity: 0;
    }
    input[type="checkbox"]:checked { background: var(--button); border-color: var(--button); }
    input[type="checkbox"]:checked::after { opacity: 1; }
    .forgot {
      color: var(--pink-accent);
      font-size: calc(var(--u) * 14); font-weight: 600;
      text-decoration: none;
    }
    .forgot:hover { text-decoration: underline; }

    .submit {
      display: block; width: 100%; height: calc(var(--u) * 46);
      border: 0; border-radius: 999px; background: var(--button); color: #fff;
      font: 600 calc(var(--u) * 16) var(--font-button);
      cursor: pointer; transition: background .15s;
    }
    .submit:hover { background: #cf6c7d; }
    .submit:focus-visible { outline: 3px solid rgba(217, 120, 138, .5); outline-offset: 2px; }
    .submit:disabled { opacity: .7; cursor: wait; }

    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

    /* ---------- Phones: stack the panels ---------- */
    @media (max-width: 720px) {
      .stage { padding: 16px; }
      .card { --u: 1.35px; grid-template-columns: 1fr; min-height: 0; }
      .brand { padding: 40px 24px 36px; }
      .logo { width: 120px; height: 120px; }
      .brand h2 { font-size: 22px; margin-top: 20px; }
      .brand p { font-size: 15px; margin-top: 12px; }
      .form-side { padding: 28px 22px 32px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <main class="card">
        <section class="brand">
          <div class="logo"><img src="../Images-Icons/R&R Logo.jpg" alt="R&R Sweet Bites logo"></div>
          <h2>Shop Owner Access</h2>
          <p>Manage requests, quotations, schedules, payments, and gallery content.</p>
        </section>

        <section class="form-side">
          <span class="eyebrow">Admin log in</span>
          <h1>R&amp;R Admin Portal</h1>

          <div id="message" class="message" role="status" aria-live="polite"></div>

          <form id="loginForm" method="post" action="../api/admin-login.php" novalidate>
            <div class="field">
              <label for="email">Email Address</label>
              <input id="email" name="email" type="email" placeholder="admin@email.com"
                     autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required>
              <span class="error" id="email-error"></span>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="password-wrap">
                <input id="password" name="password" type="password"
                       autocomplete="current-password" maxlength="64" required>
                <button type="button" class="pw-toggle" id="pwToggle"
                        aria-pressed="false" aria-label="Show password">
                  <svg class="icon-eye" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5C5.5 5 2 12 2 12s3.5 7 10 7 10-7 10-7-3.5-7-10-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9z"/></svg>
                  <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.07A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-3.22 4.19"/><path d="M6.3 6.3C3.6 8.1 2 12 2 12s3.5 7 10 7a9.9 9.9 0 0 0 4.17-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
              <span class="error" id="password-error"></span>
            </div>

            <div class="remember-row">
              <label class="remember" for="remember"><input id="remember" name="remember" type="checkbox">Remember me</label>
              <a class="forgot" id="forgot" href="#">Forgot password?</a>
            </div>

            <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
            <button class="submit" type="submit">Log In</button>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    const REMEMBER_KEY = "rr_admin_remembered_email";

    const $ = (id) => document.getElementById(id);
    const form = $("loginForm"), messageBox = $("message"), submitBtn = form.querySelector(".submit");
    const fields = ["email", "password"];
    const dirty = {};

    function read(store, key) { try { return store.getItem(key); } catch (e) { return null; } }

    /* ---------- Validation ---------- */
    const EMAIL_RE = /^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$/;
    const rules = {
      email(v) {
        if (!v) return "Enter your email address.";
        if (/\s/.test(v)) return "Email can't contain spaces.";
        if (v.length > 254) return "Email is too long.";
        const at = v.indexOf("@");
        if (at < 1 || at !== v.lastIndexOf("@")) return "Email needs one @, like you@email.com.";
        if (v.slice(0, at).length > 64) return "Part before @ is too long.";
        if (!EMAIL_RE.test(v) || v.includes("..") || !/\.[A-Za-z]{2,}$/.test(v)) return "Enter a valid email, like you@email.com.";
      },
      password(v) {
        if (!v) return "Enter your password.";
        if (v.length > 64) return "Password is too long.";
      }
    };
    const getValues = () => ({ email: $("email").value.trim().toLowerCase(), password: $("password").value });

    function showError(id, msg) {
      const input = $(id);
      $(id + "-error").textContent = msg || "";
      input.setAttribute("aria-invalid", msg ? "true" : "false");
      if (msg) input.setAttribute("aria-describedby", id + "-error"); else input.removeAttribute("aria-describedby");
    }
    function validateField(id) {
      const msg = rules[id](getValues()[id]);
      showError(id, msg);
      return !msg;
    }
    function showMessage(text, type) { messageBox.textContent = text; messageBox.className = "message " + type; }

    /* ---------- Input cleanup + live validation ---------- */
    $("email").addEventListener("input", (e) => {
      const clean = e.target.value.replace(/\s/g, "");
      if (clean !== e.target.value) e.target.value = clean;
    });
    $("email").addEventListener("blur", (e) => { e.target.value = e.target.value.trim().toLowerCase(); });
    fields.forEach((id) => {
      const input = $(id);
      input.addEventListener("input", () => {
        dirty[id] = true;
        if (input.getAttribute("aria-invalid") === "true") validateField(id);
      });
      input.addEventListener("blur", () => { if (dirty[id] || input.value) validateField(id); });
    });

    /* ---------- Remember me ---------- */
    const saved = read(localStorage, REMEMBER_KEY);
    if (saved) { $("email").value = saved; $("remember").checked = true; }

    /* ---------- Show/hide password ---------- */
    $("pwToggle").addEventListener("click", () => {
      const input = $("password");
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      $("pwToggle").setAttribute("aria-pressed", show ? "true" : "false");
      $("pwToggle").setAttribute("aria-label", show ? "Hide password" : "Show password");
      input.focus({ preventScroll: true });
    });

    $("forgot").addEventListener("click", (e) => {
      e.preventDefault();
      showMessage("Password reset isn't available yet. Contact the system owner.", "fail");
    });

    /* ---------- Submit ---------- */
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      messageBox.className = "message";

      if (fields.map(validateField).includes(false)) {
        const bad = document.querySelector('[aria-invalid="true"]');
        if (bad) bad.focus();
        return;
      }

      const { email, password } = getValues();
      const remember = $("remember").checked;
      submitBtn.disabled = true;

      try {
        const res = await fetch("../api/admin-login.php", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, remember, website: form.website.value })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          $("password").value = "";
          return showMessage(data.message || "Invalid email or password.", "fail");
        }
        try {
          remember ? localStorage.setItem(REMEMBER_KEY, email) : localStorage.removeItem(REMEMBER_KEY);
        } catch (err) { /* storage blocked — fine */ }
        showMessage("Welcome back, " + data.firstName + "!", "success");
        setTimeout(() => { window.location.href = data.redirect; }, 800);
      } catch (err) {
        showMessage("Can't reach the server. Please try again.", "fail");
      } finally {
        submitBtn.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
